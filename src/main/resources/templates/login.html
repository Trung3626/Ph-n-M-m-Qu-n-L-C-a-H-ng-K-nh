<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            background: #f4f7fb;
        }

        .container {
            width: 100%;
            display: flex;
        }

        .login-box {
            width: 42%;
            min-width: 380px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 70px;
        }

        .logo {
            text-align: center;
            color: #0b57d0;
            margin-bottom: 35px;
        }

        .logo-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .logo h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        .logo p {
            margin-top: 12px;
            color: #555;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 0 14px;
            border: 1px solid #d6dbe3;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0b57d0;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            color: #555;
        }

        .remember input {
            width: auto;
            height: auto;
        }

        button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 6px;
            background: #0b57d0;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #0846aa;
        }

        .image-box {
            flex: 1;
            background: url("https://images.unsplash.com/photo-1574258495973-f010dfbb5371?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .login-box {
                width: 100%;
                min-width: unset;
                padding: 40px 25px;
            }

            .image-box {
                display: none;
            }
        }
    </style>

</head>
<body>
<div class="container">
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">👓</div>
            <h2>QUẢN LÝ<br>CỬA HÀNG KÍNH</h2>
        </div>

        <form action="/account/login" method="post">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập tên đăng nhập">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu">
            </div>

            <div class="remember">
                <input type="checkbox" id="remember">
                <span>Ghi nhớ đăng nhập</span>
            </div>

            <button type="submit">Đăng nhập</button>
        </form>
    </div>

    <div class="image-box"></div>
</div>

</body>
</html>
